<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Recursive Roulette PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1c2c;
            --card: #24273a;
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.4);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #333750;
            --pink: #ff007f;
            --input-bg: #0f111a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            display: flex;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            flex-direction: row;
        }

        /* Responsive Layout */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }
            #sidebar {
                width: 100% !important;
                height: 70% !important; /* スマホ時は少し高く設定 */
                order: 2;
                border-left: none !important;
                border-top: 1px solid var(--border);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                position: fixed !important;
                bottom: 0;
                left: 0;
                box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            }
            #sidebar.collapsed {
                transform: translateY(100%);
            }
            #main-view {
                flex: 1;
                order: 1;
                padding: 10px;
                padding-bottom: 80px; /* 下部ボタン用のスペース */
            }
            .canvas-container {
                transform: scale(0.8);
                margin: -20px 0 !important;
            }
            .logo-area h1 {
                font-size: 1.8rem !important;
            }
        }

        /* Sidebar & Editor UI */
        #sidebar {
            width: 400px;
            background: rgba(36, 39, 58, 0.98);
            backdrop-filter: blur(15px);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 150;
        }

        .sidebar-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            flex-shrink: 0;
        }

        .editor-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 40px; /* コンテンツ末尾の余白 */
            -webkit-overflow-scrolling: touch; /* iOSスクロール改善 */
        }

        .level-card {
            background: rgba(15, 17, 26, 0.4);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .level-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 6px;
        }

        .level-title-row input {
            background: transparent;
            border: none;
            color: #fff;
            font-weight: 900;
            font-size: 1rem;
            width: 70%;
            outline: none;
        }

        .segment-card {
            background: var(--card);
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid var(--border);
        }

        .seg-main-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sub-config-box {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 10px;
            font-size: 0.8rem;
        }

        .config-inputs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }

        input[type="text"], select {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
        }

        /* Main View UI */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #24273a 0%, #1a1c2c 100%);
            position: relative;
            overflow: hidden;
        }

        .logo-area {
            position: absolute;
            top: 20px;
            text-align: center;
            z-index: 10;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .canvas-container {
            position: relative;
            margin: 20px 0;
        }

        .pin-wrapper {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .pin-shape {
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 35px solid var(--pink);
            filter: drop-shadow(0 0 8px var(--pink));
        }

        #wheel-canvas {
            max-width: 90vw;
            max-height: 50vh; /* 高さ制限を追加 */
            width: auto;
            height: auto;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            align-items: center;
            padding-bottom: 20px;
            z-index: 20;
        }

        .btn-spin {
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: white;
            padding: 14px 60px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 50px;
            box-shadow: 0 10px 30px var(--accent-glow);
            border: none;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
        }

        .toggle-editor-btn {
            display: none;
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            z-index: 60;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @media (max-width: 900px) {
            .toggle-editor-btn { display: block; }
        }

        /* Modal & Judge UI */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
            padding: 20px;
        }

        .modal-card {
            background: var(--card);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .judge-screen {
            background: #000;
            height: 180px;
            width: 140px;
            border-radius: 12px;
            margin: 15px auto;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        #needle-v {
            position: absolute;
            left: 0; top: 50%;
            width: 100%; height: 4px;
            background: #fff;
            box-shadow: 0 0 15px #fff;
            z-index: 10;
        }

        .footer-actions {
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            background: var(--card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="main-view">
    <div class="logo-area">
        <h1>ROULETTE</h1>
        <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 5px;">
            <span id="display-lv-name">メイン</span>
        </div>
    </div>

    <div class="canvas-container">
        <div class="pin-wrapper"><div class="pin-shape"></div></div>
        <canvas id="wheel-canvas" width="500" height="500"></canvas>
    </div>

    <div class="controls">
        <button class="btn-spin" id="spin-btn" onclick="App.spin()">SPIN</button>
        <button onclick="App.goBack()" id="back-btn" style="background:none; border:1px solid var(--border); color:var(--text-dim); padding:8px 25px; border-radius:30px; font-size:0.8rem;" disabled>BACK</button>
    </div>

    <button class="toggle-editor-btn" onclick="App.toggleSidebar()">設定を編集</button>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <h3 style="margin:0; font-size:0.9rem; color:var(--text-dim)">ルーレット編集</h3>
        <button onclick="App.toggleSidebar()" style="background:none; border:none; color:var(--accent); font-weight:700; padding:10px;">閉じる</button>
    </div>
    <div class="editor-container" id="editor-list">
        <!-- JSで階層カードが挿入される -->
    </div>
    <div class="footer-actions">
        <button onclick="App.addLevel()" style="width:100%; padding:14px; border-radius:12px; background:var(--accent); color:white; border:none; font-weight:900; margin-bottom:10px; cursor:pointer;">+ 階層を追加</button>
        <div style="display: flex; gap: 8px;">
            <button onclick="App.exportJSON()" style="flex:1; font-size:11px; padding:10px; background:var(--input-bg); color:var(--text-dim); border:1px solid var(--border); border-radius:8px;">保存</button>
            <button onclick="App.importJSON()" style="flex:1; font-size:11px; padding:10px; background:var(--input-bg); color:var(--text-dim); border:1px solid var(--border); border-radius:8px;">読込</button>
        </div>
    </div>
</div>

<div id="modal-overlay">
    <div class="modal-card">
        <div style="font-size:0.7rem; color:var(--text-dim); letter-spacing:2px;">RESULT</div>
        <div id="res-label" style="font-size:1.8rem; font-weight:900; margin:10px 0;">---</div>

        <div id="judge-ui" class="hidden">
            <p style="font-size:0.8rem; color:var(--text-dim); margin-bottom:10px;">連鎖チャンス！</p>
            <div class="judge-screen">
                <div class="judge-zone zone-top" id="ui-success-label" style="flex:1; background:linear-gradient(#4f46e5,#312e81); display:flex; align-items:center; justify-content:center; font-weight:bold; color:white;">成功</div>
                <div class="judge-zone zone-bottom" id="ui-fail-label" style="flex:1; background:linear-gradient(#1e1b4b,#000); display:flex; align-items:center; justify-content:center; font-weight:bold; color:white;">失敗</div>
                <div id="needle-v"></div>
            </div>
            <button id="judge-start-btn" class="btn-spin" style="font-size:1rem; width:100%; padding:12px; margin-top:10px;" onclick="App.runJudge()">判定を開始</button>
        </div>

        <div id="final-ui" class="hidden">
            <button class="btn-close" style="width:100%; padding:14px; background:var(--border); color:white; border:none; border-radius:12px; margin-top:10px; font-weight:bold;" onclick="App.closeModal()">閉じる</button>
        </div>
    </div>
</div>

<script>
const App = {
    state: {
        levels: {
            "main": {
                name: "メインルーレット",
                segments: [
                    { label: "RUSH突入", isSub: true, color: "#e11d48", targetId: "sub1", failTargetId: "main", successLabel: "突入！", failLabel: "ハズレ" },
                    { label: "通常時", isSub: false, color: "#334155" }
                ]
            },
            "sub1": {
                name: "超絶RUSH",
                segments: [
                    { label: "1500", isSub: true, color: "#7c3aed", targetId: "sub1", failTargetId: "main", successLabel: "継続！", failLabel: "終了" },
                    { label: "3000", isSub: true, color: "#db2777", targetId: "sub1", failTargetId: "main", successLabel: "継続！", failLabel: "終了" }
                ]
            }
        },
        current: "main",
        stack: [],
        rotation: 0,
        isSpinning: false
    },

    init() {
        this.canvas = document.getElementById('wheel-canvas');
        this.ctx = this.canvas.getContext('2d');
        const saved = localStorage.getItem("roulette_mobile_v2");
        if(saved) this.state.levels = JSON.parse(saved);
        
        this.renderEditor();
        this.updateUI();
        this.draw();
        
        // スマホなら初期状態でサイドバーを閉じる
        if(window.innerWidth <= 900) {
            document.getElementById('sidebar').classList.add('collapsed');
        }
    },

    save() { localStorage.setItem("roulette_mobile_v2", JSON.stringify(this.state.levels)); },

    toggleSidebar() {
        const sb = document.getElementById('sidebar');
        sb.classList.toggle('collapsed');
    },

    updateUI() {
        const lv = this.state.levels[this.state.current];
        document.getElementById('display-lv-name').textContent = lv ? lv.name : "---";
        document.getElementById('back-btn').disabled = this.state.stack.length === 0;
    },

    draw() {
        const lv = this.state.levels[this.state.current];
        if(!lv) return;
        const segs = lv.segments;
        const n = segs.length;
        const arc = (Math.PI * 2) / n;
        const cx = 250, cy = 250, r = 240;

        this.ctx.clearRect(0,0,500,500);
        segs.forEach((s, i) => {
            const angle = this.state.rotation + i * arc;
            this.ctx.beginPath();
            this.ctx.fillStyle = s.color || "#444";
            this.ctx.moveTo(cx, cy);
            this.ctx.arc(cx, cy, r, angle, angle + arc);
            this.ctx.fill();

            this.ctx.save();
            this.ctx.translate(cx, cy);
            this.ctx.rotate(angle + arc / 2);
            this.ctx.textAlign = "right";
            this.ctx.fillStyle = "#fff";
            this.ctx.font = "900 16px 'Outfit'";
            const text = s.label.length > 8 ? s.label.substring(0,7)+".." : s.label;
            this.ctx.fillText(text.toUpperCase(), r - 30, 6);
            this.ctx.restore();
        });

        // Center
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, 25, 0, Math.PI*2);
        this.ctx.fillStyle = "#1a1c2c";
        this.ctx.fill();
        this.ctx.strokeStyle = varProp('--border');
        this.ctx.stroke();
    },

    spin() {
        if(this.state.isSpinning) return;
        this.state.isSpinning = true;
        document.getElementById('spin-btn').disabled = true;

        const duration = 3500;
        const start = performance.now();
        const startRot = this.state.rotation;
        const totalRot = startRot + Math.PI * 12 + Math.random() * Math.PI * 4;

        const animate = (time) => {
            const progress = Math.min((time - start) / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 4);
            this.state.rotation = startRot + (totalRot - startRot) * ease;
            this.draw();
            if(progress < 1) requestAnimationFrame(animate);
            else this.finishSpin();
        };
        requestAnimationFrame(animate);
    },

    finishSpin() {
        this.state.isSpinning = false;
        document.getElementById('spin-btn').disabled = false;
        const lv = this.state.levels[this.state.current];
        const n = lv.segments.length;
        const arc = (Math.PI * 2) / n;
        const normRot = ((Math.PI * 1.5 - this.state.rotation) % (Math.PI * 2) + (Math.PI * 2)) % (Math.PI * 2);
        const idx = Math.floor(normRot / arc);
        const result = lv.segments[idx];

        this.activeResult = result;
        this.showModal(result);
    },

    showModal(res) {
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('res-label').textContent = res.label;
        document.getElementById('judge-ui').classList.add('hidden');
        document.getElementById('final-ui').classList.add('hidden');
        document.getElementById('judge-start-btn').disabled = false;

        if(res.isSub) {
            document.getElementById('judge-ui').classList.remove('hidden');
            document.getElementById('ui-success-label').textContent = res.successLabel || "成功";
            document.getElementById('ui-fail-label').textContent = res.failLabel || "失敗";
            document.getElementById('needle-v').style.top = "50%";
        } else {
            document.getElementById('final-ui').classList.remove('hidden');
        }
    },

    runJudge() {
        const needle = document.getElementById('needle-v');
        const startBtn = document.getElementById('judge-start-btn');
        startBtn.disabled = true;
        
        const duration = 5000;
        const start = performance.now();
        const success = Math.random() > 0.6;

        const anim = (time) => {
            const elapsed = time - start;
            const p = Math.min(elapsed / duration, 1);
            const minSpeed = 1.2;
            const maxSpeed = 6.0;
            const currentSpeed = minSpeed + (p * (maxSpeed - minSpeed)); 
            
            const amplitude = 35;
            const pos = 50 + Math.sin(elapsed / 1000 * currentSpeed * Math.PI) * amplitude;
            
            needle.style.top = (p < 1 ? pos : (success ? 25 : 75)) + "%";
            
            if(p < 1) requestAnimationFrame(anim);
            else this.completeJudge(success);
        };
        requestAnimationFrame(anim);
    },

    completeJudge(success) {
        const res = this.activeResult;
        const label = success ? (res.successLabel || "成功") : (res.failLabel || "失敗");
        document.getElementById('res-label').textContent = label + "！";
        
        setTimeout(() => {
            if(success) {
                this.state.stack.push(this.state.current);
                this.state.current = res.targetId || "main";
            } else if(res.failTargetId) {
                this.state.stack = [];
                this.state.current = res.failTargetId;
            }
            this.closeModal();
            this.updateUI();
            this.draw();
        }, 1200);
    },

    closeModal() { document.getElementById('modal-overlay').style.display = 'none'; },

    goBack() {
        if(this.state.stack.length > 0) {
            this.state.current = this.state.stack.pop();
            this.updateUI();
            this.draw();
        }
    },

    renderEditor() {
        const list = document.getElementById('editor-list');
        list.innerHTML = "";
        const lvs = Object.entries(this.state.levels);

        lvs.forEach(([id, lv]) => {
            const card = document.createElement('div');
            card.className = "level-card";
            card.innerHTML = `
                <div class="level-title-row">
                    <input type="text" value="${lv.name}" onchange="App.editLv('${id}', this.value)">
                    ${id !== 'main' ? `<button onclick="App.delLv('${id}')" style="background:none; border:none; color:var(--pink); font-size:1.5rem; padding:0 5px;">×</button>` : ''}
                </div>
                ${lv.segments.map((s, i) => `
                    <div class="segment-card">
                        <div class="seg-main-row">
                            <input type="color" value="${s.color}" onchange="App.editSeg('${id}', ${i}, 'color', this.value)" style="width:30px;height:30px;border:none;background:none;flex-shrink:0;">
                            <input type="text" value="${s.label}" onchange="App.editSeg('${id}', ${i}, 'label', this.value)" style="flex:1; min-width:0;">
                            <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
                                <span style="font-size:10px; color:var(--text-dim)">連鎖</span>
                                <input type="checkbox" ${s.isSub ? 'checked' : ''} onchange="App.editSeg('${id}', ${i}, 'isSub', this.checked)" style="width:18px;height:18px;">
                            </div>
                            <button onclick="App.delSeg('${id}', ${i})" style="color:var(--pink); border:none; background:none; font-size:1.2rem; padding:5px;">×</button>
                        </div>
                        ${s.isSub ? `
                            <div class="sub-config-box">
                                <div class="config-inputs">
                                    <input type="text" placeholder="成功時表示" value="${s.successLabel || ''}" onchange="App.editSeg('${id}', ${i}, 'successLabel', this.value)" style="flex:1">
                                    <select onchange="App.editSeg('${id}', ${i}, 'targetId', this.value)" style="flex:1">
                                        ${lvs.map(([lid, ll]) => `<option value="${lid}" ${s.targetId === lid ? 'selected' : ''}>${ll.name}へ</option>`).join('')}
                                    </select>
                                </div>
                                <div class="config-inputs">
                                    <input type="text" placeholder="失敗時表示" value="${s.failLabel || ''}" onchange="App.editSeg('${id}', ${i}, 'failLabel', this.value)" style="flex:1">
                                    <select onchange="App.editSeg('${id}', ${i}, 'failTargetId', this.value)" style="flex:1">
                                        <option value="">(移動なし)</option>
                                        ${lvs.map(([lid, ll]) => `<option value="${lid}" ${s.failTargetId === lid ? 'selected' : ''}>${ll.name}へ</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `).join('')}
                <button onclick="App.addSeg('${id}')" style="width:100%; margin-top:12px; background:transparent; border:1px dashed var(--border); color:var(--text-dim); padding:10px; border-radius:8px; font-size:0.8rem;">+ 項目を追加</button>
            `;
            list.appendChild(card);
        });
    },

    editLv(id, v) { this.state.levels[id].name = v; this.save(); this.updateUI(); },
    addLevel() { const id = "lv"+Date.now(); this.state.levels[id] = { name: "新階層", segments: [{ label: "NEW", color: "#6366f1", isSub: false }] }; this.renderEditor(); this.save(); },
    delLv(id) { delete this.state.levels[id]; this.renderEditor(); this.save(); },
    editSeg(id, i, k, v) { this.state.levels[id].segments[i][k] = v; this.save(); this.renderEditor(); this.draw(); },
    addSeg(id) { this.state.levels[id].segments.push({ label: "ITEM", color: "#444", isSub: false }); this.renderEditor(); this.draw(); this.save(); },
    delSeg(id, i) { this.state.levels[id].segments.splice(i, 1); this.renderEditor(); this.draw(); this.save(); },
    exportJSON() {
        const b = new Blob([JSON.stringify(this.state.levels, null, 2)], {type:"application/json"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = "roulette_config.json"; a.click();
    },
    importJSON() {
        const i = document.createElement('input'); i.type = 'file';
        i.onchange = (e) => {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (re) => { this.state.levels = JSON.parse(re.target.result); this.renderEditor(); this.draw(); this.save(); };
            r.readAsText(f);
        };
        i.click();
    }
};

function varProp(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

window.onload = () => App.init();
</script>
</body>
</html>

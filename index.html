<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Recursive Roulette PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1c2c;
            --card: #24273a;
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.4);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #333750;
            --pink: #ff007f;
            --input-bg: #0f111a;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            flex-direction: row;
        }

        /* Responsive Layout */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }
            #sidebar {
                width: 100% !important;
                height: 75% !important;
                order: 2;
                border-left: none !important;
                border-top: 1px solid var(--border);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                position: fixed !important;
                bottom: 0;
                left: 0;
                box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
                z-index: 100;
            }
            #sidebar.collapsed {
                transform: translateY(100%);
            }
            #main-view {
                flex: 1;
                order: 1;
                padding-bottom: 80px;
            }
        }

        /* Sidebar & Editor UI */
        #sidebar {
            width: 400px;
            background: rgba(36, 39, 58, 0.98);
            backdrop-filter: blur(15px);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            flex-shrink: 0;
        }

        .editor-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        .editor-container::-webkit-scrollbar {
            width: 8px;
        }
        .editor-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .editor-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .level-card {
            background: rgba(15, 17, 26, 0.4);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .level-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 6px;
        }

        .level-title-row input {
            background: transparent;
            border: none;
            color: #fff;
            font-weight: 900;
            font-size: 1rem;
            width: 70%;
            outline: none;
        }

        .segment-card {
            background: var(--card);
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid var(--border);
        }

        .seg-main-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sub-config-box {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 10px;
            font-size: 0.8rem;
        }

        .config-inputs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }

        input[type="text"], select {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
        }

        /* Main View UI */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #24273a 0%, #1a1c2c 100%);
            position: relative;
            overflow: hidden;
        }

        .top-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
        }

        .logo-area {
            text-align: center;
            flex: 1;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .history-btn {
            background: rgba(15, 17, 26, 0.6);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .canvas-container {
            position: relative;
            margin: 20px 0;
        }

        .pin-wrapper {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .pin-shape {
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 35px solid var(--pink);
            filter: drop-shadow(0 0 8px var(--pink));
        }

        #wheel-canvas {
            max-width: 90vw;
            max-height: 50vh;
            width: auto;
            height: auto;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            align-items: center;
            padding-bottom: 20px;
            z-index: 20;
        }

        .btn-spin {
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: white;
            padding: 14px 60px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 50px;
            box-shadow: 0 10px 30px var(--accent-glow);
            border: none;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
            transition: transform 0.1s;
        }

        .btn-spin:active { transform: scale(0.96); }

        .toggle-editor-btn {
            display: none;
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            z-index: 60;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @media (max-width: 900px) {
            .toggle-editor-btn { display: block; }
        }

        .footer-actions {
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            background: var(--card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        /* Modal / Alert UI */
        #modal-overlay, #alert-overlay, #history-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 500;
            padding: 20px;
        }

        .modal-card, .alert-card, .history-card {
            background: var(--card);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
            width: 100%;
            max-width: 360px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
            text-align: left;
        }

        .history-item {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .history-item .time { color: var(--text-dim); font-size: 0.7rem; }
        .history-item .label { font-weight: bold; }
        .history-item .meta { font-size: 0.65rem; color: var(--text-dim); }

        .judge-screen {
            background: #000;
            height: 180px;
            width: 140px;
            border-radius: 12px;
            margin: 15px auto;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        #needle-v {
            position: absolute;
            left: 0; top: 50%;
            width: 100%; height: 4px;
            background: #fff;
            box-shadow: 0 0 15px #fff;
            z-index: 10;
        }

        .hidden { display: none; }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div id="main-view">
    <div class="top-nav">
        <button class="history-btn" onclick="App.toggleHistory()">HISTORY</button>
        <div class="logo-area">
            <h1>ROULETTE</h1>
            <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 5px;">
                <span id="display-lv-name">メイン</span>
            </div>
        </div>
        <div style="width: 60px;"></div>
    </div>

    <div class="canvas-container">
        <div class="pin-wrapper"><div class="pin-shape"></div></div>
        <canvas id="wheel-canvas" width="500" height="500"></canvas>
    </div>

    <div class="controls">
        <button class="btn-spin" id="spin-btn" onclick="App.spin()">SPIN</button>
        <button onclick="App.goBack()" id="back-btn" style="background:none; border:1px solid var(--border); color:var(--text-dim); padding:8px 25px; border-radius:30px; font-size:0.8rem;" disabled>BACK</button>
    </div>

    <button class="toggle-editor-btn" onclick="App.toggleSidebar()">設定を開く</button>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <h3 style="margin:0; font-size:0.9rem; color:var(--text-dim)">ルーレット編集</h3>
        <button onclick="App.toggleSidebar()" style="background:none; border:none; color:var(--accent); font-weight:700; padding:10px;">閉じる</button>
    </div>
    
    <div class="editor-container" id="editor-list"></div>

    <div class="footer-actions">
        <button onclick="App.addLevel()" style="width:100%; padding:14px; border-radius:12px; background:var(--accent); color:white; border:none; font-weight:900; margin-bottom:12px; cursor:pointer;">+ 階層を追加</button>
        
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <button onclick="App.exportJSON()" style="flex:1; font-size:11px; padding:10px; background:var(--input-bg); color:var(--text-dim); border:1px solid var(--border); border-radius:8px;">JSON保存</button>
            <button onclick="App.importJSON()" style="flex:1; font-size:11px; padding:10px; background:var(--input-bg); color:var(--text-dim); border:1px solid var(--border); border-radius:8px;">JSON読込</button>
        </div>

        <button onclick="App.confirmReset()" style="width:100%; padding:10px; border-radius:8px; background:rgba(239, 68, 68, 0.1); color:var(--danger); border:1px solid rgba(239, 68, 68, 0.3); font-size:11px; font-weight:700; cursor:pointer;">設定をリセット（初期化）</button>
    </div>
</div>

<div id="history-overlay">
    <div class="history-card">
        <h3 style="margin:0 0 15px 0;">履歴</h3>
        <div class="history-list" id="history-items"></div>
        <button style="width:100%; padding:14px; background:var(--border); color:white; border:none; border-radius:12px; font-weight:bold; cursor:pointer;" onclick="App.toggleHistory()">閉じる</button>
    </div>
</div>

<div id="modal-overlay">
    <div class="modal-card">
        <div style="font-size:0.7rem; color:var(--text-dim); letter-spacing:2px;">RESULT</div>
        <div id="res-label" style="font-size:1.8rem; font-weight:900; margin:10px 0;">---</div>

        <div id="judge-ui" class="hidden">
            <p style="font-size:0.8rem; color:var(--text-dim); margin-bottom:10px;">連鎖チャンス！</p>
            <div class="judge-screen">
                <div class="judge-zone" id="ui-success-label" style="flex:1; background:linear-gradient(#4f46e5,#312e81); display:flex; align-items:center; justify-content:center; font-weight:bold; color:white;">成功</div>
                <div class="judge-zone" id="ui-fail-label" style="flex:1; background:linear-gradient(#1e1b4b,#000); display:flex; align-items:center; justify-content:center; font-weight:bold; color:white;">失敗</div>
                <div id="needle-v"></div>
            </div>
            <button id="judge-start-btn" class="btn-spin" style="font-size:1rem; width:100%; padding:12px; margin-top:10px;" onclick="App.runJudge()">判定を開始</button>
        </div>

        <div id="final-ui" class="hidden">
            <button style="width:100%; padding:14px; background:var(--border); color:white; border:none; border-radius:12px; margin-top:10px; font-weight:bold; cursor:pointer;" onclick="App.closeModal()">閉じる</button>
        </div>
    </div>
</div>

<div id="alert-overlay">
    <div class="alert-card">
        <h4 style="margin-top:0;">確認</h4>
        <p id="alert-msg" style="font-size:0.9rem; color:var(--text-dim); line-height:1.5;"></p>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button id="alert-cancel" style="flex:1; padding:12px; border-radius:10px; background:var(--border); border:none; color:white; cursor:pointer;">キャンセル</button>
            <button id="alert-ok" style="flex:1; padding:12px; border-radius:10px; background:var(--danger); border:none; color:white; font-weight:bold; cursor:pointer;">実行する</button>
        </div>
    </div>
</div>

<script>
const DEFAULT_LEVELS = {
    "main": {
        name: "メインルーレット",
        segments: [
            { label: "RUSH突入", isSub: true, color: "#e11d48", targetId: "sub1", failTargetId: "main", successLabel: "突入！", failLabel: "ハズレ" },
            { label: "ハズレ", isSub: false, color: "#334155" }
        ]
    },
    "sub1": {
        name: "超絶RUSH",
        segments: [
            { label: "1500", isSub: true, color: "#7c3aed", targetId: "sub1", failTargetId: "main", successLabel: "継続！", failLabel: "終了" },
            { label: "3000", isSub: true, color: "#db2777", targetId: "sub1", failTargetId: "main", successLabel: "継続！", failLabel: "終了" }
        ]
    }
};

const App = {
    state: {
        levels: JSON.parse(JSON.stringify(DEFAULT_LEVELS)),
        current: "main",
        stack: [],
        rotation: 0,
        isSpinning: false,
        history: []
    },

    init() {
        this.canvas = document.getElementById('wheel-canvas');
        this.ctx = this.canvas.getContext('2d');
        
        const saved = localStorage.getItem("roulette_pro_v5");
        if(saved) {
            try { 
                const data = JSON.parse(saved);
                this.state.levels = data.levels || this.state.levels;
                this.state.history = data.history || [];
            } catch(e) {}
        }
        
        this.renderEditor();
        this.updateUI();
        this.draw();
        
        if(window.innerWidth <= 900) {
            document.getElementById('sidebar').classList.add('collapsed');
        }
    },

    save() { 
        localStorage.setItem("roulette_pro_v5", JSON.stringify({
            levels: this.state.levels,
            history: this.state.history
        })); 
    },

    confirmReset() {
        this.showAlert("全ての設定と履歴を削除し、初期状態に戻しますか？", () => {
            this.state.levels = JSON.parse(JSON.stringify(DEFAULT_LEVELS));
            this.state.current = "main";
            this.state.stack = [];
            this.state.history = [];
            this.save();
            this.renderEditor();
            this.updateUI();
            this.draw();
        });
    },

    showAlert(msg, onOk) {
        const overlay = document.getElementById('alert-overlay');
        const msgEl = document.getElementById('alert-msg');
        const okBtn = document.getElementById('alert-ok');
        const cancelBtn = document.getElementById('alert-cancel');
        msgEl.textContent = msg;
        overlay.style.display = 'flex';
        okBtn.onclick = () => { onOk(); overlay.style.display = 'none'; };
        cancelBtn.onclick = () => { overlay.style.display = 'none'; };
    },

    toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('collapsed');
    },

    toggleHistory() {
        const overlay = document.getElementById('history-overlay');
        const isOpening = overlay.style.display !== 'flex';
        overlay.style.display = isOpening ? 'flex' : 'none';
        
        if(isOpening) {
            const list = document.getElementById('history-items');
            list.innerHTML = this.state.history.length === 0 ? '<p style="color:var(--text-dim); text-align:center;">履歴はありません</p>' : '';
            this.state.history.slice().reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = "history-item";
                div.innerHTML = `
                    <div style="flex:1">
                        <div class="label" style="color:${item.color}">${item.label}</div>
                        <div class="meta">${item.level}</div>
                    </div>
                    <div class="time">${item.time}</div>
                `;
                list.appendChild(div);
            });
        }
    },

    updateUI() {
        const lv = this.state.levels[this.state.current];
        document.getElementById('display-lv-name').textContent = lv ? lv.name : "---";
        document.getElementById('back-btn').disabled = this.state.stack.length === 0;
    },

    draw() {
        const lv = this.state.levels[this.state.current];
        if(!lv) return;
        const segs = lv.segments;
        const n = segs.length;
        const arc = (Math.PI * 2) / n;
        const cx = 250, cy = 250, r = 240;

        this.ctx.clearRect(0,0,500,500);
        segs.forEach((s, i) => {
            const angle = this.state.rotation + i * arc;
            this.ctx.beginPath();
            this.ctx.fillStyle = s.color || "#444";
            this.ctx.moveTo(cx, cy);
            this.ctx.arc(cx, cy, r, angle, angle + arc);
            this.ctx.fill();

            this.ctx.save();
            this.ctx.translate(cx, cy);
            this.ctx.rotate(angle + arc / 2);
            this.ctx.textAlign = "right";
            this.ctx.fillStyle = "#fff";
            this.ctx.font = "900 16px 'Outfit'";
            const text = s.label.length > 8 ? s.label.substring(0,7)+".." : s.label;
            this.ctx.fillText(text.toUpperCase(), r - 30, 6);
            this.ctx.restore();
        });

        this.ctx.beginPath();
        this.ctx.arc(cx, cy, 25, 0, Math.PI*2);
        this.ctx.fillStyle = "#1a1c2c";
        this.ctx.fill();
        this.ctx.strokeStyle = "#333750";
        this.ctx.stroke();
    },

    spin() {
        if(this.state.isSpinning) return;
        this.state.isSpinning = true;
        document.getElementById('spin-btn').disabled = true;

        const duration = 4000;
        const start = performance.now();
        const startRot = this.state.rotation;
        const totalRot = startRot + Math.PI * 15 + Math.random() * Math.PI * 5;

        const animate = (time) => {
            const progress = Math.min((time - start) / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 5);
            this.state.rotation = startRot + (totalRot - startRot) * ease;
            this.draw();
            if(progress < 1) requestAnimationFrame(animate);
            else this.finishSpin();
        };
        requestAnimationFrame(animate);
    },

    finishSpin() {
        this.state.isSpinning = false;
        document.getElementById('spin-btn').disabled = false;
        const lv = this.state.levels[this.state.current];
        const n = lv.segments.length;
        const arc = (Math.PI * 2) / n;
        const normRot = ((Math.PI * 1.5 - this.state.rotation) % (Math.PI * 2) + (Math.PI * 2)) % (Math.PI * 2);
        const idx = Math.floor(normRot / arc);
        const result = lv.segments[idx];

        this.activeResult = result;
        
        // 通常のセグメントが当たった場合のみ履歴に追加（連鎖の場合は判定後に履歴追加）
        if(!result.isSub) {
            this.addHistory(result.label, result.color, lv.name);
        }
        
        this.showModal(result);
    },

    addHistory(label, color, levelName) {
        const now = new Date();
        const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
        this.state.history.push({ label, color, level: levelName, time });
        if(this.state.history.length > 50) this.state.history.shift();
        this.save();
    },

    showModal(res) {
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('res-label').textContent = res.label;
        document.getElementById('judge-ui').classList.add('hidden');
        document.getElementById('final-ui').classList.add('hidden');

        if(res.isSub) {
            document.getElementById('judge-ui').classList.remove('hidden');
            document.getElementById('ui-success-label').textContent = res.successLabel || "成功";
            document.getElementById('ui-fail-label').textContent = res.failLabel || "失敗";
            document.getElementById('judge-start-btn').disabled = false;
            document.getElementById('needle-v').style.top = "50%";
        } else {
            document.getElementById('final-ui').classList.remove('hidden');
        }
    },

    runJudge() {
        const needle = document.getElementById('needle-v');
        const startBtn = document.getElementById('judge-start-btn');
        startBtn.disabled = true;
        
        const duration = 4000;
        const start = performance.now();
        const success = Math.random() > 0.6;

        const anim = (time) => {
            const elapsed = time - start;
            const p = Math.min(elapsed / duration, 1);
            const speed = 1.5 + (p * 5); 
            const amplitude = 35;
            const pos = 50 + Math.sin(elapsed / 1000 * speed * Math.PI) * amplitude;
            needle.style.top = (p < 1 ? pos : (success ? 25 : 75)) + "%";
            
            if(p < 1) requestAnimationFrame(anim);
            else this.completeJudge(success);
        };
        requestAnimationFrame(anim);
    },

    completeJudge(success) {
        const res = this.activeResult;
        const label = success ? (res.successLabel || "成功") : (res.failLabel || "失敗");
        document.getElementById('res-label').textContent = label + "！";
        
        // 判定結果も履歴に残す
        this.addHistory(`${res.label} ➔ ${label}`, success ? "#10b981" : "#ef4444", this.state.levels[this.state.current].name);

        setTimeout(() => {
            if(success) {
                this.state.stack.push(this.state.current);
                this.state.current = res.targetId || "main";
            } else if(res.failTargetId) {
                this.state.stack = [];
                this.state.current = res.failTargetId;
            }
            this.closeModal();
            this.updateUI();
            this.draw();
        }, 1500);
    },

    closeModal() { document.getElementById('modal-overlay').style.display = 'none'; },

    goBack() {
        if(this.state.stack.length > 0) {
            this.state.current = this.state.stack.pop();
            this.updateUI();
            this.draw();
        }
    },

    renderEditor() {
        const list = document.getElementById('editor-list');
        list.innerHTML = "";
        const lvs = Object.entries(this.state.levels);

        lvs.forEach(([id, lv]) => {
            const card = document.createElement('div');
            card.className = "level-card";
            card.innerHTML = `
                <div class="level-title-row">
                    <input type="text" value="${lv.name}" onchange="App.editLv('${id}', this.value)">
                    ${id !== 'main' ? `<button onclick="App.delLv('${id}')" style="background:none; border:none; color:var(--pink); font-size:1.5rem; cursor:pointer;">×</button>` : ''}
                </div>
                ${lv.segments.map((s, i) => `
                    <div class="segment-card">
                        <div class="seg-main-row">
                            <input type="color" value="${s.color}" onchange="App.editSeg('${id}', ${i}, 'color', this.value)" style="width:30px;height:30px;border:none;background:none;flex-shrink:0;">
                            <input type="text" value="${s.label}" onchange="App.editSeg('${id}', ${i}, 'label', this.value)" style="flex:1; min-width:0;">
                            <div style="display:flex; flex-direction:column; align-items:center;">
                                <span style="font-size:9px; color:var(--text-dim)">連鎖</span>
                                <input type="checkbox" ${s.isSub ? 'checked' : ''} onchange="App.editSeg('${id}', ${i}, 'isSub', this.checked)">
                            </div>
                            <button onclick="App.delSeg('${id}', ${i})" style="color:var(--pink); border:none; background:none; font-size:1.2rem; cursor:pointer;">×</button>
                        </div>
                        ${s.isSub ? `
                            <div class="sub-config-box">
                                <div class="config-inputs">
                                    <input type="text" placeholder="成功時表示" value="${s.successLabel || ''}" onchange="App.editSeg('${id}', ${i}, 'successLabel', this.value)" style="flex:1">
                                    <select onchange="App.editSeg('${id}', ${i}, 'targetId', this.value)" style="flex:1">
                                        ${lvs.map(([lid, ll]) => `<option value="${lid}" ${s.targetId === lid ? 'selected' : ''}>${ll.name}へ</option>`).join('')}
                                    </select>
                                </div>
                                <div class="config-inputs">
                                    <input type="text" placeholder="失敗時表示" value="${s.failLabel || ''}" onchange="App.editSeg('${id}', ${i}, 'failLabel', this.value)" style="flex:1">
                                    <select onchange="App.editSeg('${id}', ${i}, 'failTargetId', this.value)" style="flex:1">
                                        <option value="">(移動なし)</option>
                                        ${lvs.map(([lid, ll]) => `<option value="${lid}" ${s.failTargetId === lid ? 'selected' : ''}>${ll.name}へ</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `).join('')}
                <button onclick="App.addSeg('${id}')" style="width:100%; margin-top:12px; background:transparent; border:1px dashed var(--border); color:var(--text-dim); padding:10px; border-radius:8px; font-size:0.8rem; cursor:pointer;">+ 項目を追加</button>
            `;
            list.appendChild(card);
        });
    },

    editLv(id, v) { this.state.levels[id].name = v; this.save(); this.updateUI(); },
    addLevel() { const id = "lv"+Date.now(); this.state.levels[id] = { name: "新階層", segments: [{ label: "NEW", color: "#6366f1", isSub: false }] }; this.renderEditor(); this.save(); },
    delLv(id) { 
        if(this.state.current === id) this.state.current = "main";
        delete this.state.levels[id]; 
        this.renderEditor(); this.save(); 
    },
    editSeg(id, i, k, v) { this.state.levels[id].segments[i][k] = v; this.save(); this.renderEditor(); this.draw(); },
    addSeg(id) { this.state.levels[id].segments.push({ label: "ITEM", color: "#444", isSub: false }); this.renderEditor(); this.draw(); this.save(); },
    delSeg(id, i) { this.state.levels[id].segments.splice(i, 1); this.renderEditor(); this.draw(); this.save(); },
    
    exportJSON() {
        const b = new Blob([JSON.stringify(this.state.levels, null, 2)], {type:"application/json"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = "roulette_pro.json"; a.click();
    },
    importJSON() {
        const i = document.createElement('input'); i.type = 'file';
        i.onchange = (e) => {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (re) => { 
                try {
                    const data = JSON.parse(re.target.result); 
                    this.state.levels = data;
                    this.renderEditor(); this.draw(); this.save(); this.updateUI(); 
                } catch(err) { console.error("Invalid JSON"); }
            };
            r.readAsText(f);
        };
        i.click();
    }
};

window.onload = () => App.init();
</script>
</body>
</html>

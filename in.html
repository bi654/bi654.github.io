<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursive Roulette PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1c2c;
            --card: #24273a;
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.4);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #333750;
            --pink: #ff007f;
            --input-bg: #0f111a;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar & Editor UI */
        #sidebar {
            width: 420px;
            background: rgba(36, 39, 58, 0.95);
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            order: 2;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .editor-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .level-card {
            background: rgba(15, 17, 26, 0.4);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .level-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 6px;
        }

        .level-title-row input {
            background: transparent;
            border: none;
            color: #fff;
            font-weight: 900;
            font-size: 1.1rem;
            width: 80%;
            outline: none;
        }

        .segment-card {
            background: var(--card);
            border-radius: 10px;
            padding: 14px;
            margin-top: 10px;
            border: 1px solid var(--border);
            position: relative;
        }

        .seg-main-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .sub-config-box {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .config-label {
            color: var(--text-dim);
            font-size: 0.75rem;
        }

        .config-inputs {
            display: flex;
            gap: 8px;
        }

        input[type="text"], select {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            flex: 1;
        }

        input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 4px;
            background: none;
            cursor: pointer;
        }

        .chain-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-dim);
            cursor: pointer;
        }

        /* Main View UI */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #24273a 0%, #1a1c2c 100%);
            position: relative;
            order: 1;
        }

        .logo-area {
            position: absolute;
            top: 40px;
            text-align: center;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .location-tag {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 8px;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .canvas-container {
            position: relative;
            margin: 40px 0;
        }

        .pin-wrapper {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: none;
        }

        .pin-shape {
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 40px solid var(--pink);
            filter: drop-shadow(0 0 8px var(--pink));
        }

        .btn-spin {
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: white;
            padding: 16px 80px;
            font-size: 1.4rem;
            font-weight: 900;
            border-radius: 50px;
            box-shadow: 0 10px 30px var(--accent-glow);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-spin:hover { transform: translateY(-2px); box-shadow: 0 15px 40px var(--accent-glow); }
        .btn-spin:active { transform: translateY(1px); }
        .btn-spin:disabled { opacity: 0.3; cursor: default; transform: none; }

        /* Modal & Judge UI */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-card {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
            width: 400px;
        }

        .judge-screen {
            background: #000;
            height: 240px;
            width: 180px;
            border-radius: 12px;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .judge-zone {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            color: #fff;
        }
        .zone-top { background: linear-gradient(to bottom, #4f46e5, #312e81); }
        .zone-bottom { background: linear-gradient(to top, #1e1b4b, #000); }

        #needle-v {
            position: absolute;
            left: 0; top: 50%;
            width: 100%; height: 4px;
            background: #fff;
            box-shadow: 0 0 15px #fff;
            z-index: 10;
        }

        .history-item {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .btn-close {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            background: var(--border);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="main-view">
    <div class="logo-area">
        <h1>ROULETTE</h1>
        <div class="location-tag">LOCATION: <span id="display-lv-name">メインルーレット</span></div>
    </div>

    <div class="canvas-container">
        <div class="pin-wrapper" id="wheel-pin"><div class="pin-shape"></div></div>
        <canvas id="wheel-canvas" width="500" height="500"></canvas>
    </div>

    <button class="btn-spin" id="spin-btn" onclick="App.spin()">SPIN</button>
    <div style="margin-top: 20px;">
        <button onclick="App.goBack()" id="back-btn" style="background:none; border:1px solid var(--border); color:var(--text-dim); padding:6px 20px; border-radius:30px; cursor:pointer;" disabled>BACK</button>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <h3 style="margin:0; font-size:1rem; color:var(--text-dim)">ルーレット編集</h3>
    </div>
    <div class="editor-container" id="editor-list"></div>
    <div style="padding: 20px; border-top: 1px solid var(--border);">
        <button onclick="App.addLevel()" style="width:100%; padding:12px; border-radius:8px; background:var(--accent); color:white; border:none; font-weight:900; cursor:pointer;">+ 階層を追加</button>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button onclick="App.exportJSON()" style="flex:1; font-size:11px; padding:8px; background:var(--input-bg); color:var(--text-dim); border:1px solid var(--border); cursor:pointer;">保存</button>
            <button onclick="App.importJSON()" style="flex:1; font-size:11px; padding:8px; background:var(--input-bg); color:var(--text-dim); border:1px solid var(--border); cursor:pointer;">読込</button>
        </div>
    </div>
    <div style="padding: 0 20px 20px 20px; border-top: 1px solid var(--border);">
        <p style="font-size:0.75rem; color:var(--text-dim); margin:10px 0;">HISTORY</p>
        <div id="history-box"></div>
    </div>
</div>

<div id="modal-overlay">
    <div class="modal-card">
        <div style="font-size:0.7rem; color:var(--text-dim); letter-spacing:2px;">RESULT</div>
        <div id="res-label" style="font-size:2rem; font-weight:900; margin:10px 0;">---</div>

        <div id="judge-ui" class="hidden">
            <p style="font-size:0.85rem; color:var(--text-dim);" id="judge-hint">判定中...</p>
            <div class="judge-screen">
                <div class="judge-zone zone-top" id="ui-success-label">成功</div>
                <div class="judge-zone zone-bottom" id="ui-fail-label">失敗</div>
                <div id="needle-v"></div>
            </div>
            <button id="judge-start-btn" class="btn-spin" style="font-size:1rem; width:100%; padding:12px;" onclick="App.runJudge()">判定を開始</button>
        </div>

        <div id="final-ui" class="hidden">
            <button class="btn-close" onclick="App.closeModal()">閉じる</button>
        </div>
    </div>
</div>

<script>
const App = {
    state: {
        levels: {
            "main": {
                name: "メインルーレット",
                segments: [
                    { label: "RUSH突入", isSub: true, color: "#e11d48", targetId: "sub1", failTargetId: "main", successLabel: "突入！", failLabel: "ハズレ" },
                    { label: "通常時", isSub: false, color: "#334155" }
                ]
            },
            "sub1": {
                name: "超絶RUSH",
                segments: [
                    { label: "1500", isSub: true, color: "#7c3aed", targetId: "sub1", failTargetId: "main", successLabel: "継続する", failLabel: "継続しない" },
                    { label: "3000", isSub: true, color: "#db2777", targetId: "sub1", failTargetId: "main", successLabel: "継続する", failLabel: "継続しない" }
                ]
            }
        },
        current: "main",
        stack: [],
        rotation: 0,
        isSpinning: false,
        history: []
    },

    init() {
        this.canvas = document.getElementById('wheel-canvas');
        this.ctx = this.canvas.getContext('2d');
        const saved = localStorage.getItem("roulette_v3_default");
        if(saved) this.state.levels = JSON.parse(saved);
        this.renderEditor();
        this.updateUI();
        this.draw();
    },

    save() { localStorage.setItem("roulette_v3_default", JSON.stringify(this.state.levels)); },

    updateUI() {
        const lv = this.state.levels[this.state.current];
        document.getElementById('display-lv-name').textContent = lv ? lv.name : "---";
        document.getElementById('back-btn').disabled = this.state.stack.length === 0;
    },

    draw() {
        const lv = this.state.levels[this.state.current];
        if(!lv) return;
        const segs = lv.segments;
        const n = segs.length;
        const arc = (Math.PI * 2) / n;
        const cx = 250, cy = 250, r = 240;

        this.ctx.clearRect(0,0,500,500);
        segs.forEach((s, i) => {
            const angle = this.state.rotation + i * arc;
            this.ctx.beginPath();
            this.ctx.fillStyle = s.color || "#444";
            this.ctx.moveTo(cx, cy);
            this.ctx.arc(cx, cy, r, angle, angle + arc);
            this.ctx.fill();
            this.ctx.strokeStyle = "rgba(255,255,255,0.1)";
            this.ctx.stroke();

            this.ctx.save();
            this.ctx.translate(cx, cy);
            this.ctx.rotate(angle + arc / 2);
            this.ctx.textAlign = "right";
            this.ctx.fillStyle = "#fff";
            this.ctx.font = "900 16px 'Outfit'";
            this.ctx.fillText(s.label.toUpperCase(), r - 30, 6);
            this.ctx.restore();
        });

        // Center hole
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, 30, 0, Math.PI*2);
        this.ctx.fillStyle = "#1a1c2c";
        this.ctx.fill();
        this.ctx.stroke();
    },

    spin() {
        if(this.state.isSpinning) return;
        this.state.isSpinning = true;
        document.getElementById('spin-btn').disabled = true;

        const duration = 4000;
        const start = performance.now();
        const startRot = this.state.rotation;
        const totalRot = startRot + Math.PI * 15 + Math.random() * Math.PI * 5;

        const animate = (time) => {
            const progress = Math.min((time - start) / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 3);
            this.state.rotation = startRot + (totalRot - startRot) * ease;
            this.draw();
            if(progress < 1) requestAnimationFrame(animate);
            else this.finishSpin();
        };
        requestAnimationFrame(animate);
    },

    finishSpin() {
        this.state.isSpinning = false;
        document.getElementById('spin-btn').disabled = false;
        const lv = this.state.levels[this.state.current];
        const n = lv.segments.length;
        const arc = (Math.PI * 2) / n;
        const normRot = ((Math.PI * 1.5 - this.state.rotation) % (Math.PI * 2) + (Math.PI * 2)) % (Math.PI * 2);
        const idx = Math.floor(normRot / arc);
        const result = lv.segments[idx];

        this.activeResult = result;
        this.showModal(result);
        this.addHistory(result.label);
    },

    showModal(res) {
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('res-label').textContent = res.label;
        document.getElementById('judge-ui').classList.add('hidden');
        document.getElementById('final-ui').classList.add('hidden');
        document.getElementById('judge-start-btn').disabled = false;

        if(res.isSub) {
            document.getElementById('judge-ui').classList.remove('hidden');
            document.getElementById('ui-success-label').textContent = res.successLabel || "成功";
            document.getElementById('ui-fail-label').textContent = res.failLabel || "失敗";
            document.getElementById('judge-hint').textContent = "連鎖チャンス！判定に突入しますか？";
            document.getElementById('needle-v').style.top = "50%";
        } else {
            document.getElementById('final-ui').classList.remove('hidden');
        }
    },

    runJudge() {
        const needle = document.getElementById('needle-v');
        const startBtn = document.getElementById('judge-start-btn');
        startBtn.disabled = true;
        
        const duration = 5000; // 5秒間
        const start = performance.now();
        const success = Math.random() > 0.6;

        const anim = (time) => {
            const elapsed = time - start;
            const p = Math.min(elapsed / duration, 1);
            
            // --- 速度設定の修正 ---
            // 最初は speed 1.5 (かなりゆったり) から始まり、
            // 最後は speed 7 (普通のルーレット判定レベル) まで加速
            const minSpeed = 1.5;
            const maxSpeed = 7.0;
            const currentSpeed = minSpeed + (p * (maxSpeed - minSpeed)); 
            
            // 振幅
            const amplitude = 35;
            // サイン波で上下。p < 1 の間だけ動かす
            const pos = 50 + Math.sin(elapsed / 1000 * currentSpeed * Math.PI) * amplitude;
            
            needle.style.top = (p < 1 ? pos : (success ? 25 : 75)) + "%";
            
            if(p < 1) requestAnimationFrame(anim);
            else this.completeJudge(success);
        };
        requestAnimationFrame(anim);
    },

    completeJudge(success) {
        const res = this.activeResult;
        const label = success ? (res.successLabel || "成功") : (res.failLabel || "失敗");
        document.getElementById('res-label').textContent = label + "！";
        
        setTimeout(() => {
            if(success) {
                this.state.stack.push(this.state.current);
                this.state.current = res.targetId || "main";
            } else if(res.failTargetId) {
                this.state.stack = [];
                this.state.current = res.failTargetId;
            }
            this.closeModal();
            this.updateUI();
            this.draw();
        }, 1500);
    },

    closeModal() { document.getElementById('modal-overlay').style.display = 'none'; },

    goBack() {
        if(this.state.stack.length > 0) {
            this.state.current = this.state.stack.pop();
            this.updateUI();
            this.draw();
        }
    },

    addHistory(label) {
        this.state.history.unshift({ label, time: new Date().toLocaleTimeString() });
        const box = document.getElementById('history-box');
        box.innerHTML = this.state.history.slice(0,5).map(h => `
            <div class="history-item"><span>${h.label}</span><span style="opacity:0.4">${h.time}</span></div>
        `).join('');
    },

    renderEditor() {
        const list = document.getElementById('editor-list');
        list.innerHTML = "";
        const lvs = Object.entries(this.state.levels);

        lvs.forEach(([id, lv]) => {
            const card = document.createElement('div');
            card.className = "level-card";
            card.innerHTML = `
                <div class="level-title-row">
                    <input type="text" value="${lv.name}" onchange="App.editLv('${id}', this.value)">
                    ${id !== 'main' ? `<button onclick="App.delLv('${id}')" style="background:none; border:none; color:var(--pink); cursor:pointer;">×</button>` : ''}
                </div>
                ${lv.segments.map((s, i) => `
                    <div class="segment-card">
                        <div class="seg-main-row">
                            <input type="color" value="${s.color}" onchange="App.editSeg('${id}', ${i}, 'color', this.value)">
                            <input type="text" value="${s.label}" onchange="App.editSeg('${id}', ${i}, 'label', this.value)">
                            <label class="chain-toggle">連鎖 <input type="checkbox" ${s.isSub ? 'checked' : ''} onchange="App.editSeg('${id}', ${i}, 'isSub', this.checked)"></label>
                            <button onclick="App.delSeg('${id}', ${i})" style="color:#ef4444; border:none; background:none; cursor:pointer;">×</button>
                        </div>
                        ${s.isSub ? `
                            <div class="sub-config-box">
                                <div class="config-group">
                                    <span class="config-label">成功時の挙動:</span>
                                    <div class="config-inputs">
                                        <input type="text" value="${s.successLabel || '成功'}" onchange="App.editSeg('${id}', ${i}, 'successLabel', this.value)">
                                        <select onchange="App.editSeg('${id}', ${i}, 'targetId', this.value)">
                                            ${lvs.map(([lid, ll]) => `<option value="${lid}" ${s.targetId === lid ? 'selected' : ''}>${ll.name}へ</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                                <div class="config-group">
                                    <span class="config-label">失敗時の挙動:</span>
                                    <div class="config-inputs">
                                        <input type="text" value="${s.failLabel || '失敗'}" onchange="App.editSeg('${id}', ${i}, 'failLabel', this.value)">
                                        <select onchange="App.editSeg('${id}', ${i}, 'failTargetId', this.value)">
                                            <option value="">(遷移なし)</option>
                                            ${lvs.map(([lid, ll]) => `<option value="${lid}" ${s.failTargetId === lid ? 'selected' : ''}>${ll.name}へ</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `).join('')}
                <button onclick="App.addSeg('${id}')" style="width:100%; margin-top:15px; background:transparent; border:1px dashed var(--border); color:var(--text-dim); padding:8px; border-radius:6px; cursor:pointer;">+ 項目を追加</button>
            `;
            list.appendChild(card);
        });
    },

    editLv(id, v) { this.state.levels[id].name = v; this.save(); this.updateUI(); },
    addLevel() { const id = "lv"+Date.now(); this.state.levels[id] = { name: "新階層", segments: [{ label: "NEW", color: "#6366f1", isSub: false }] }; this.renderEditor(); this.save(); },
    delLv(id) { delete this.state.levels[id]; this.renderEditor(); this.save(); },
    editSeg(id, i, k, v) { this.state.levels[id].segments[i][k] = v; this.save(); this.renderEditor(); this.draw(); },
    addSeg(id) { this.state.levels[id].segments.push({ label: "ITEM", color: "#444", isSub: false }); this.renderEditor(); this.draw(); this.save(); },
    delSeg(id, i) { this.state.levels[id].segments.splice(i, 1); this.renderEditor(); this.draw(); this.save(); },
    exportJSON() {
        const b = new Blob([JSON.stringify(this.state.levels, null, 2)], {type:"application/json"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = "roulette.json"; a.click();
    },
    importJSON() {
        const i = document.createElement('input'); i.type = 'file';
        i.onchange = (e) => {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (re) => { this.state.levels = JSON.parse(re.target.result); this.renderEditor(); this.draw(); this.save(); };
            r.readAsText(f);
        };
        i.click();
    }
};

window.onload = () => App.init();
</script>
</body>
</html>
